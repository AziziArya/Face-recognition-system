[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-system"
version = "1.0.0"
description = "Webcam face detection and recognition pipeline (face_recognition/dlib) with a supplementary Haar-cascade detection demo (OpenCV)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arya Azizi" }]
dependencies = [
    "opencv-python>=4.8,<5",
    "face-recognition>=1.3,<2",
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
